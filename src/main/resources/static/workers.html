<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workers - Smart Waste Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
    const CURRENT_USER = renderShell('workers', 'Collection Workers');
    if (!CURRENT_USER) { document.write(''); }
</script>

<template id="workers-template">
    <div class="panel">
        <div class="panel-header">
            <h3>Waste Collection Workers</h3>
            <div class="toolbar">
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="ON_LEAVE">On Leave</option>
                </select>
                <button class="btn btn-primary" id="add-btn">+ Add Worker</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Phone</th><th>Assigned Area</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="workers-body"></tbody>
            </table>
        </div>
    </div>
</template>

<div class="modal-overlay" id="worker-modal">
    <div class="modal-box">
        <h3 id="modal-title">Add Worker</h3>
        <form id="worker-form">
            <input type="hidden" id="workerId">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="phone" required>
            </div>
            <div class="form-group">
                <label>Assigned Area</label>
                <input type="text" id="assignedArea" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="ON_LEAVE">On Leave</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="js/workers.js"></script>
</body>
</html>
