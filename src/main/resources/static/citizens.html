<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizens - Smart Waste Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
    const CURRENT_USER = renderShell('citizens', 'Citizens');
    if (!CURRENT_USER) { document.write(''); }
</script>

<template id="citizens-template">
    <div class="panel">
        <div class="panel-header">
            <h3>Registered Citizens</h3>
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="Search by name...">
                <button class="btn btn-primary" id="add-btn">+ Add Citizen</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Area</th><th>Ward</th><th>Actions</th></tr>
                </thead>
                <tbody id="citizens-body"></tbody>
            </table>
        </div>
    </div>
</template>

<div class="modal-overlay" id="citizen-modal">
    <div class="modal-box">
        <h3 id="modal-title">Add Citizen</h3>
        <form id="citizen-form">
            <input type="hidden" id="citizenId">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Area</label>
                    <input type="text" id="area" required>
                </div>
                <div class="form-group">
                    <label>Ward Number</label>
                    <input type="number" id="wardNumber" min="1">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="js/citizens.js"></script>
</body>
</html>
