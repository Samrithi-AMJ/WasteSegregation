<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Collections - Smart Waste Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
    const CURRENT_USER = renderShell('collections', 'Waste Collections');
    if (!CURRENT_USER) { document.write(''); }
</script>

<template id="collections-template">
    <div class="panel">
        <div class="panel-header">
            <h3>Collection Records</h3>
            <div class="toolbar">
                <input type="text" id="area-filter" placeholder="Filter by area...">
                <select id="type-filter">
                    <option value="">All Waste Types</option>
                    <option value="WET">Wet</option>
                    <option value="DRY">Dry</option>
                    <option value="PLASTIC">Plastic</option>
                    <option value="PAPER">Paper</option>
                    <option value="OTHER">Other</option>
                </select>
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="COLLECTED">Collected</option>
                    <option value="PENDING">Pending</option>
                    <option value="MISSED">Missed</option>
                </select>
                <input type="date" id="date-filter">
                <button class="btn btn-primary" id="add-btn">+ Add Collection</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>ID</th><th>Citizen</th><th>Area</th><th>Waste Type</th><th>Qty (kg)</th><th>Worker</th><th>Vehicle</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="collections-body"></tbody>
            </table>
        </div>
    </div>
</template>

<div class="modal-overlay" id="collection-modal">
    <div class="modal-box">
        <h3 id="modal-title">Add Collection</h3>
        <form id="collection-form">
            <input type="hidden" id="collectionId">
            <div class="form-group">
                <label>Citizen</label>
                <select id="citizenId" required></select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Worker</label>
                    <select id="workerId"><option value="">-- None --</option></select>
                </div>
                <div class="form-group">
                    <label>Vehicle</label>
                    <select id="vehicleId"><option value="">-- None --</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Collection Date</label>
                    <input type="date" id="collectionDate" required>
                </div>
                <div class="form-group">
                    <label>Area</label>
                    <input type="text" id="area" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Waste Type</label>
                    <select id="wasteType" required>
                        <option value="WET">Wet</option>
                        <option value="DRY">Dry</option>
                        <option value="PLASTIC">Plastic</option>
                        <option value="PAPER">Paper</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity (kg)</label>
                    <input type="number" id="quantity" min="0.1" step="0.1" required>
                </div>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="PENDING">Pending</option>
                    <option value="COLLECTED">Collected</option>
                    <option value="MISSED">Missed</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="js/collections.js"></script>
</body>
</html>
