<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Smart Waste Management</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<script src="js/app.js"></script>
<script>
    const CURRENT_USER = renderShell('reports', 'Reports & Analytics');
    if (!CURRENT_USER) { document.write(''); }
</script>

<template id="reports-template">
    <div class="panel">
        <div class="panel-header">
            <h3>Filter Report Data</h3>
            <div class="toolbar">
                <input type="date" id="from-date">
                <span style="color:var(--text-muted);font-size:13px;">to</span>
                <input type="date" id="to-date">
                <input type="text" id="area-filter" placeholder="Filter by area...">
                <select id="type-filter">
                    <option value="">All Waste Types</option>
                    <option value="WET">Wet</option>
                    <option value="DRY">Dry</option>
                    <option value="PLASTIC">Plastic</option>
                    <option value="PAPER">Paper</option>
                    <option value="OTHER">Other</option>
                </select>
                <button class="btn btn-primary" id="apply-filter-btn">Apply</button>
                <button class="btn btn-secondary" id="reset-filter-btn">Reset</button>
            </div>
        </div>
    </div>

    <div class="stat-grid" id="report-stat-grid"></div>

    <div class="chart-grid">
        <div class="chart-card">
            <h3>Waste Collected: Daily (last 14 days)</h3>
            <canvas id="chart-daily"></canvas>
        </div>
        <div class="chart-card">
            <h3>Waste Collected: Weekly (last 8 weeks)</h3>
            <canvas id="chart-weekly"></canvas>
        </div>
        <div class="chart-card">
            <h3>Waste Collected: Monthly (last 6 months)</h3>
            <canvas id="chart-monthly"></canvas>
        </div>
        <div class="chart-card">
            <h3>Waste by Type (filtered)</h3>
            <canvas id="chart-type"></canvas>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><h3>Area-wise Report</h3></div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>Area/Ward</th><th>Total Waste (kg)</th><th>Total Collections</th><th>Missed Collections</th><th>Segregation Rate</th></tr>
                </thead>
                <tbody id="area-report-body"></tbody>
            </table>
        </div>
    </div>
</template>

<script src="js/reports.js"></script>
</body>
</html>
