<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segregation - Smart Waste Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/app.js"></script>
<script>
    const CURRENT_USER = renderShell('segregation', 'Waste Segregation');
    if (!CURRENT_USER) { document.write(''); }
</script>

<template id="segregation-template">
    <div class="panel">
        <div class="panel-header">
            <h3>Segregation Records</h3>
            <div class="toolbar">
                <select id="status-filter">
                    <option value="">All Statuses</option>
                    <option value="PROPER">Proper</option>
                    <option value="PARTIAL">Partial</option>
                    <option value="IMPROPER">Improper</option>
                </select>
                <button class="btn btn-primary" id="add-btn">+ Add Segregation</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th><th>Collection ID</th><th>Area</th><th>Wet</th><th>Dry</th>
                        <th>Plastic</th><th>Paper</th><th>Other</th><th>Total</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="segregation-body"></tbody>
            </table>
        </div>
    </div>
</template>

<div class="modal-overlay" id="segregation-modal">
    <div class="modal-box">
        <h3 id="modal-title">Add Segregation</h3>
        <form id="segregation-form">
            <input type="hidden" id="segregationId">
            <div class="form-group">
                <label>Waste Collection</label>
                <select id="collectionId" required></select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Wet Quantity (kg)</label>
                    <input type="number" id="wetQuantity" min="0" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label>Dry Quantity (kg)</label>
                    <input type="number" id="dryQuantity" min="0" step="0.1" value="0">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Plastic Quantity (kg)</label>
                    <input type="number" id="plasticQuantity" min="0" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label>Paper Quantity (kg)</label>
                    <input type="number" id="paperQuantity" min="0" step="0.1" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>Other Quantity (kg)</label>
                <input type="number" id="otherQuantity" min="0" step="0.1" value="0">
            </div>
            <div class="form-group">
                <label>Total Quantity</label>
                <input type="text" id="totalDisplay" disabled value="0 kg">
            </div>
            <div class="form-group">
                <label>Segregation Status (leave on Auto to let the system decide)</label>
                <select id="segregationStatus">
                    <option value="">Auto-detect</option>
                    <option value="PROPER">Proper</option>
                    <option value="PARTIAL">Partial</option>
                    <option value="IMPROPER">Improper</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="js/segregation.js"></script>
</body>
</html>
